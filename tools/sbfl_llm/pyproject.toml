[project]
name = "ibex-sbfl-llm"
version = "0.1.0"
description = "LLM-assisted reranking and reporting for Ibex SBFL results"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0",
  "pydantic>=2.0",
]

[project.scripts]
ibex-sbfl = "ibex_sbfl_llm.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibex_sbfl_llm"]

[tool.hatch.build]
include = [
  "src/ibex_sbfl_llm/**/*.py",
  "src/ibex_sbfl_llm/prompts/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
