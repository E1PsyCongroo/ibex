[project]
name = "ibex-sbfl-rerank"
version = "0.1.0"
description = "Offline reranking of saved Ibex SBFL LLM responses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ibex-sbfl-batch",
]

[tool.uv.sources]
ibex-sbfl-batch = { path = "../ibex_sbfl_batch", editable = true }

[project.scripts]
ibex-sbfl-rerank = "ibex_sbfl_rerank.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibex_sbfl_rerank"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
