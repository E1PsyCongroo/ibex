[project]
name = "ibex-sbfl-batch"
version = "0.1.0"
description = "Batch generation, checkpoint analysis, and statistics for Ibex SBFL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "edalize==0.6.1",
  "fusesoc==2.4.3",
  "ibex-sbfl-common",
]

[tool.uv.sources]
ibex-sbfl-common = { path = "../ibex_sbfl_common", editable = true }

[project.scripts]
ibex-sbfl-batch = "ibex_sbfl_batch.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibex_sbfl_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
